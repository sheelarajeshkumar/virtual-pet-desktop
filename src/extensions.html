<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Community Behaviors</title>
    <link rel="stylesheet" href="extensions.css" />
    <script src="extensions.js" defer></script>
  </head>
  <body>
    <main>
      <p class="eyebrow">SAFE EXTENSIONS</p>
      <h1>Community Behaviors</h1>
      <p class="intro">
        Behaviors are bounded JSON sequences of existing pet actions. They cannot execute code,
        access files, or use the network.
      </p>
      <button id="import" type="button">IMPORT BEHAVIOR</button>
      <div id="extensions"></div>
      <p id="empty">No community behaviors installed.</p>
      <p id="message" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
