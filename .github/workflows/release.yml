name: Prepare signed release draft

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed tag to package, for example v0.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate signed release inputs
    runs-on: ubuntu-latest
    environment: release
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag, versions and protected release inputs
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          git checkout --detach "$RELEASE_TAG"

          package_version="$(node --input-type=module -e "import pkg from './package.json' with { type: 'json' }; console.log(pkg.version)")"
          cargo_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' src-tauri/Cargo.toml | head -n 1)"
          tauri_version="$(node --input-type=module -e "import config from './src-tauri/tauri.conf.json' with { type: 'json' }; console.log(config.version)")"
          [[ "$RELEASE_TAG" == "v$package_version" ]]
          [[ "$package_version" == "$cargo_version" && "$package_version" == "$tauri_version" ]]

          required=(
            APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_ISSUER
            APPLE_API_KEY APPLE_API_PRIVATE_KEY KEYCHAIN_PASSWORD
            WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD WINDOWS_TIMESTAMP_URL
          )
          for key in "${required[@]}"; do
            [[ -n "${!key:-}" ]] || { echo "Missing protected release input: $key" >&2; exit 1; }
          done
          [[ "$WINDOWS_TIMESTAMP_URL" =~ ^https?:// ]]

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

  package-macos:
    name: Package macOS (signed and notarized)
    needs: preflight
    runs-on: macos-latest
    environment: release
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Import Developer ID certificate
        shell: bash
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/apple-certificate.p12"
          keychain_path="$RUNNER_TEMP/virtual-pet-build.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          signing_identity="$(security find-identity -v -p codesigning "$keychain_path" | awk -F'\"' '/Developer ID Application/ { print $2; exit }')"
          [[ -n "$signing_identity" ]] || { echo "Developer ID Application certificate not found" >&2; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"

      - name: Write App Store Connect key
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          umask 077
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build signed and notarized DMG
        run: npm run build -- --bundles dmg --ci

      - name: Verify signature and notarization staple
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find src-tauri/target/release/bundle/macos -name '*.app' -print -quit)"
          [[ -n "$app_path" ]] || { echo "No macOS app bundle was produced" >&2; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"

      - name: Upload signed macOS DMG
        uses: actions/upload-artifact@v7
        with:
          name: virtual-pet-macos-signed-${{ needs.preflight.outputs.tag }}
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

  package-windows:
    name: Package Windows (signed)
    needs: preflight
    runs-on: windows-latest
    environment: release
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Import certificate and create ephemeral signing configuration
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'virtual-pet-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate) { throw 'Windows signing certificate import failed.' }
          $configPath = Join-Path $env:RUNNER_TEMP 'tauri.windows.signing.json'
          $config = @{ bundle = @{ windows = @{ certificateThumbprint = $certificate.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = $env:WINDOWS_TIMESTAMP_URL } } } | ConvertTo-Json -Depth 5 -Compress
          Set-Content -Path $configPath -Value $config -NoNewline
          "TAURI_SIGNING_CONFIG=$configPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          Remove-Item -Path $pfxPath -Force

      - name: Build signed Windows installer
        shell: pwsh
        run: npm run build -- --config "$env:TAURI_SIGNING_CONFIG" --bundles nsis --ci

      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $installers = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe -Recurse
          if (-not $installers) { throw 'No NSIS installer was produced.' }
          foreach ($installer in $installers) {
            & signtool verify /pa /all $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signature validation failed: $($installer.FullName)" }
          }

      - name: Upload signed Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: virtual-pet-windows-signed-${{ needs.preflight.outputs.tag }}
          path: |
            src-tauri/target/release/virtual-pet.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  create-draft:
    name: Create signed release draft
    needs:
      - preflight
      - package-macos
      - package-windows
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
    steps:
      - name: Download signed artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: virtual-pet-*-signed-${{ needs.preflight.outputs.tag }}
          path: release-assets
          merge-multiple: true

      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-assets -type f -print0)
          ((${#assets[@]})) || { echo "No signed artifacts were downloaded" >&2; exit 1; }
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --draft --generate-notes --title "Virtual Pet $RELEASE_TAG"
          fi
