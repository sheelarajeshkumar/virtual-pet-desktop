[package]
name = "virtual-pet"
version = "0.1.0"
description = "A lightweight cross-platform desktop pet"
authors = ["Sheela Rajesh Kumar"]
license = "MIT"
repository = "https://github.com/sheelarajeshkumar/virtual-pet-desktop"
homepage = "https://github.com/sheelarajeshkumar/virtual-pet-desktop"
readme = "../README.md"
edition = "2021"
rust-version = "1.85"

[lib]
name = "virtual_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.11"
futures-util = "0.3"
keyring = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = ["protocol-asset", "macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWindow"] }
